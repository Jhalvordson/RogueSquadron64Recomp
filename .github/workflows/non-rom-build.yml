# Builds the parts of this repo that do not need a ROM or the
# rogue_squadron64 decomp ELF. Skipped on purpose:
#   regen_funcs              (N64Recomp over rogue_squadron.toml + the ELF)
#   RogueSquadron64Recomp    (links gitignored RecompiledFuncs and RSP ucode)
# Nothing is uploaded. RecompiledFuncs/ and ROM images are not produced.
#
# Windows (MSVC + ClangCL) is not in this workflow. The README's tested
# non-Windows path is Ubuntu 24.04, GCC, and Ninja; that is what runs here.

name: non-rom-build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux:
    name: Linux libraries (no ROM)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache \
            libsdl2-dev libvulkan-dev libgtk-3-dev python3 pkg-config

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: |
            ccache-linux-

      - name: Configure (game link off)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DROGUESQ_BUILD_GAME=OFF \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build non-ROM targets
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/lib/rt64/src/contrib/dxc/lib/x64
        run: |
          cmake --build build --parallel 2 --target \
            N64RecompCLI librecomp ultramodern rt64 rs64_host \
            video_config_test nav_target_test

      - name: Smoke-check recompiler and unit tests
        run: |
          test -x build/N64Recomp
          ./build/video_config_test
          ./build/nav_target_test
          test ! -e build/RogueSquadron64Recomp
